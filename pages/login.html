<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ಅಧಿಕಾರಿ ಲಾಗಿನ್ - ಜನಧ್ವನಿ (Officer Login)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Noto Sans Kannada', 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl border border-slate-200 shadow-md p-8 max-w-md w-full">
    <div class="text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-teal-600 text-white flex items-center justify-center font-black text-2xl mx-auto mb-3">ಜ</div>
      <h1 class="text-xl font-bold text-slate-900">ಅಧಿಕಾರಿ ಪ್ರವೇಶ (Officer Login)</h1>
      <p class="text-xs text-slate-500 mt-1">ಜನಧ್ವನಿ ಕುಂದುಕೊರತೆ ನಿರ್ವಹಣಾ ವ್ಯವಸ್ಥೆ</p>
    </div>

    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">ಬಳಕೆದಾರ ಹೆಸರು (Username):</label>
        <input type="text" id="username" value="officer_sneha" class="w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm font-mono focus:ring-2 focus:ring-teal-600">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">ಗುಪ್ತಪದ (Password):</label>
        <input type="password" id="password" value="password123" class="w-full px-3 py-2.5 bg-slate-50 border rounded-xl text-sm font-mono focus:ring-2 focus:ring-teal-600">
      </div>
      <button type="submit" class="w-full py-3 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-xl text-sm shadow transition">
        ಲಾಗಿನ್ (Sign In)
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-200">
      <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-2">ಡೆಮೊ ಖಾತೆಗಳು (Demo Accounts):</span>
      <div class="grid grid-cols-2 gap-2 text-[11px] font-mono text-slate-600">
        <button onclick="fillLogin('officer_sneha')" class="p-1.5 bg-slate-50 rounded hover:bg-slate-100 text-left border">L1: officer_sneha</button>
        <button onclick="fillLogin('sup_deshmukh')" class="p-1.5 bg-slate-50 rounded hover:bg-slate-100 text-left border">L2: sup_deshmukh</button>
        <button onclick="fillLogin('dho_kalaburagi')" class="p-1.5 bg-slate-50 rounded hover:bg-slate-100 text-left border">L3: dho_kalaburagi</button>
        <button onclick="fillLogin('psi_sharanappa')" class="p-1.5 bg-slate-50 rounded hover:bg-slate-100 text-left border">Police: psi_sharanappa</button>
      </div>
    </div>
  </div>

  <script>
    function fillLogin(u) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = 'password123';
    }

    async function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        if (!res.ok) {
          alert('ತಪ್ಪಾದ ಬಳಕೆದಾರ ಹೆಸರು ಅಥವಾ ಗುಪ್ತಪದ.');
          return;
        }
        const data = await res.json();
        alert(`ಸ್ವಾಗತ, ${data.user.name} (${data.user.designation})!`);
        window.location.href = '/pages/officer.html';
      } catch (err) {
        alert('Login failed: ' + err.message);
      }
    }
  </script>
</body>
</html>
